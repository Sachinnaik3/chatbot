# CI release gates (deterministic fake LLM). Guards and safety must be perfect.
# Quality thresholds here check plumbing; real model quality is gated by thresholds.stage.yaml.
retrieval.recall_at_5: {op: min, value: 0.80}
retrieval.access_leakage: {op: eq, value: 0}
sql.unsafe_blocked_rate: {op: eq, value: 1.0}
sql.safe_pass_rate: {op: eq, value: 1.0}
injection.detection_rate: {op: min, value: 0.9}
injection.false_positive_rate: {op: max, value: 0.05}
pii.leak_rate: {op: eq, value: 0.0}
guard.extraction_quote: {op: eq, value: 1.0}
guard.domain_review_support: {op: eq, value: 1.0}
guard.findings_remediation: {op: eq, value: 1.0}
guard.fix_verification_quote: {op: eq, value: 1.0}
guard.brief_numeric_grounding: {op: eq, value: 1.0}
drafting.guard_catch_rate: {op: eq, value: 1.0}
drafting.status_accuracy: {op: min, value: 0.85}
drafting.unsupported_claim_rate: {op: eq, value: 0.0}
triage.exact_match: {op: min, value: 0.75}
intake.gap_recall: {op: min, value: 0.9}
intake.false_gaps: {op: eq, value: 0}
extraction.category_recall: {op: min, value: 0.8}
change.rereview_recall: {op: eq, value: 1.0}
change.accuracy: {op: min, value: 0.9}
workflow.reached_approval: {op: eq, value: 1.0}
workflow.gate_bypass_blocked_rate: {op: eq, value: 1.0}
workflow.audit_chain_valid: {op: eq, value: 1.0}
latency.agent_p95_s: {op: max, value: 1.0}
cost.tokens_per_full_review: {op: max, value: 60000}
