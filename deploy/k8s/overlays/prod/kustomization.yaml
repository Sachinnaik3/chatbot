apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pia-prod
resources: [../../base]
configMapGenerator:
  - name: pia-config
    literals:
      - PIA_ENV=prod
      - PIA_LLM_PROVIDER=anthropic
      - PIA_PERSISTENCE=postgres
# pia-secrets is created by the secret manager integration (External Secrets), never committed.
patches:
  - target: {kind: Deployment, name: pia-api}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
